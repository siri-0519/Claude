# 이 레포의 설정. 틀에서 복사한 레포는 이 파일만 제 것으로 고친다. 기계(ops/)는 그대로 둔다.
# 칸의 뜻과 기본값은 ops/lib/공통.py 의 기본설정 에 있다. 여기 없는 칸은 기본값이다.
이름: 틀
소개: |
  문서 레포의 틀이다. 복사해서 이름을 바꾸고 `.ops.yml` 을 고쳐 쓴다. 서브모듈로 잇지 않는다.
  설계는 `설계.md`, 기계 규칙은 `ops/rules/기계.yml`, 판단 규칙은 `ops/rules/판단.md` 에 있다.
주제파일: ["*.md"]
제외: [README.md, STATUS.md, CLAUDE.md, worklog.md, 설명서.md, "memory/**", "ops/**", ".claude/**"]   # 설명서.md 는 설계 · 규칙 파일에서 옮겨 쓴 파생물이라 주제 파일 검사 대신 어긋남 목록으로 본다 (2026-09-17)
표시: [확인, 제안]
표시패턴: '\[(확인|제안)(?:\s[^\]]*)?\]'
결정로그: ""
목차:
  - 말: 설계 · 목적 다섯 · 목표 넷 · 맥락 · 토큰 · 파생물 · 규칙 두 종류 · 옮기는 순서 · 답의 모양 · 표 · 그림 · 시각화
    파일: 설계.md
  - 말: 레포마다의 판단 규칙 전문 · 규칙 98개가 어디로 가나 · 검증 기록
    파일: 설계-부록.md
  - 말: 설명서 · 받아 쓰는 법 · 동료에게 주기 · 복사해서 쓰기 · 설치 · 어떻게 돌아가나 · 낱말 풀이
    파일: 설명서.md
판정:
  모델: sonnet   # 2026-09-16 haiku 에서 바꿈 — 시간은 비슷하고(부록 C) 규칙 7 사례를 12/12 잡는다
  명령: claude
  시간: 300     # claude -p 가 이 환경에서 작은 물음에도 45초쯤 걸린다 (2026-09-14 실측)
  묶음: 20     # 커밋 직전 문서 판정은 새 줄을 이만큼씩 나눠 부른다
  끄기: false
