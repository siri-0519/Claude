# 기계 규칙 대장 — 스크립트가 글자만 보고 맞는지 정할 수 있는 규칙.
# 판단이 드는 규칙은 여기 없고 ops/rules/판단.md 에 있다 (설계 5절).
# 칸: 이름(스크립트가 부르는 열쇠) · 문장(규칙) · 자리(언제 보나) · 검사(무엇이 보나). 네 칸이 다 있어야 한다.
# 자리는 이 가운데 하나 이상이다: 저장직전 · 명령직전 · 도구직후 · 답끝 · 커밋직전 · push직전 · 세션시작
- 이름: 상대날짜
  문장: 답과 문서에 시점을 가리키는 상대 표현(어제 · 아까 · 지난번 …)을 쓰지 않는다. 날짜를 적는다.
  자리: [저장직전, 답끝, 커밋직전]
  검사: 기계.상대날짜 — 주제 파일의 새 줄과 답에서 .ops.yml 상대날짜 목록의 낱말을 찾는다. 「」 안은 제목이라 보지 않는다
- 이름: 표시
  문장: 주제 파일에 새로 들어가는 주장 줄(목록 항 · 번호 항 · 표 행)에는 이 저장소의 표시 가운데 하나가 붙어 있다.
  자리: [저장직전, 커밋직전]
  검사: 표시.검사_글 · 표시.검사_새줄 — 검사 전부터 있던 줄은 보지 않고 새 줄만 본다
- 이름: 제안확인
  문장: >-
    "[제안]"이 "[확인]"으로 바뀌는 것은 사용자가 GitHub 웹에서 한 커밋에서만 된다.
  자리: [커밋직전]
  검사: 표시.제안이확인으로 — 스테이지에서 같은 줄의 표시만 바뀐 것을 찾는다
- 이름: 생성파일
  문장: 스크립트가 만드는 파일(STATUS.md · README.md · worklog.md · memory/어긋남.md · CLAUDE.md 의 생성 블록)은 손으로 고치지 않는다. 원본을 고치고 `ops build` 를 돌린다.
  자리: [저장직전, 명령직전, 커밋직전]
  검사: 생성.생성파일인가 · 생성.다른것 — Edit · Write · 셸 재지정을 막고, 원본과 다른 채로는 커밋을 막는다. 어긋남 목록에도 오른다
- 이름: 목차크기
  문장: CLAUDE.md 는 800줄, 한 절은 120줄을 넘지 않는다.
  자리: [저장직전, 커밋직전]
  검사: 기계.목차크기
- 이름: 지금절
  문장: 주제 파일의 「지금」 절은 열 줄 안이다. 지금 참인 것은 그 절에만 적는다.
  자리: [커밋직전]
  검사: 지금.검사
- 이름: 파일크기
  문장: 주제 파일 하나는 30KB 안이다. 넘으면 절로 나눈다.
  자리: [커밋직전]
  검사: 기계.파일크기
- 이름: 작업로그
  문장: worklog.md 는 커밋하지 않는다. git log 에서 세션 시작마다 다시 만든다.
  자리: [커밋직전]
  검사: 기계.작업로그 — 스테이지에 worklog.md 가 있으면 막는다
- 이름: 브랜치
  문장: 답이 끝날 때 고친 것이 커밋돼 있고 이 세션의 브랜치가 원격에 있다.
  자리: [답끝]
  검사: 기계.브랜치 — 커밋 안 한 변경이나 push 안 한 커밋이 있으면 답을 되돌린다 (한 세션에 두 번까지)
- 이름: 이력
  문장: 이력을 다시 쓰는 push(force · 브랜치 삭제)를 하지 않는다.
  자리: [명령직전, push직전]
  검사: 기계.셸검사 · ops/hooks/pre-push — 명령 글자와 push 의 ref 를 본다
- 이름: 기계보호
  문장: 기계(ops/ · .claude/ · .ops.yml · memory/)를 통째로 지우지 않는다.
  자리: [명령직전]
  검사: 기계.셸검사 — rm -r 이 그 자리를 가리키면 막는다
- 이름: 낱말후보
  문장: 답의 낱말 가운데 사용자의 말 · 이 세션에 읽은 파일 · 허용 목록 어디에도 없는 낱말을 뽑아 판정 모델에 넘긴다.
  자리: [답끝]
  검사: 낱말.후보 — 잡는 것은 판정 모델이 규칙 「아는 말만 쓴다」로 한다
- 이름: 어긋남
  문장: 원본이 바뀌어 낡은 파생물은 막지 않고 memory/어긋남.md 에 오른다. 세션 시작에 통째로 들어가고 답 끝에 개수만 알린다.
  자리: [세션시작, 도구직후, 답끝]
  검사: 어긋남.만들기 — 파생물 옆 파일(<파생물>.meta.yml)에 적힌 출처의 해시와 지금 본문을 견준다
