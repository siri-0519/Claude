# 기계 규칙 대장 — 스크립트가 글자만 보고 맞는지 정할 수 있는 규칙.
# 판단이 드는 규칙은 여기 없고 ops/rules/판단.md 에 있다 (설계 5절).
# 칸: 이름(스크립트가 부르는 열쇠) · 문장(규칙) · 자리(언제 보나) · 검사(무엇이 보나) · 목적(목적 다섯 가운데 무엇을 지키나) · 시험(목적을 이루는지 무엇으로 보나).
#   여섯 칸이 다 있어야 한다 — 없으면 커밋이 막힌다 (규칙 「규칙대장」, 2026-09-17).
# 자리는 이 가운데 하나 이상이다: 저장직전 · 명령직전 · 도구직후 · 답끝 · 커밋직전 · push직전 · 세션시작 · 원격
# 목적은 이 가운데 하나 이상이다: 규칙 준수 · 맥락 유지 · 토큰 절약 · 정보 추적성 · 좋은 설명 (설계 1절). 어디에도 안 닿는 규칙은 뺀다.
# 시험은 이 가운데 하나 이상이다: "selftest: <ops/test/selftest.py 의 시험 이름>" · "시뮬: S<번호>" (ops/test/시뮬.py 의 시나리오) ·
#   "읽힘: <설계-부록.md 부록 C 나 훅-글.md 의 기록>" · "워크플로: <.github/workflows 의 파일>". 실재하지 않는 참조는 커밋이 막힌다.
- 이름: 상대날짜
  문장: 답과 문서에 시점을 가리키는 상대 표현(어제 · 아까 · 지난번 …)을 쓰지 않는다. 날짜를 적는다.
  자리: [저장직전, 답끝, 커밋직전]
  검사: 기계.상대날짜 — 주제 파일의 새 줄과 답에서 .ops.yml 상대날짜 목록의 낱말을 찾는다. 「」 안은 제목이라 보지 않는다
  목적: [맥락 유지, 좋은 설명]
  시험: ["selftest: 주제 파일 새 줄의 상대 날짜와 표시 없음을 막는다", "selftest: 답 끝에 상대 날짜를 되돌린다", "selftest: git 훅이 상대 날짜가 든 커밋을 막는다", "selftest: 따옴표와 「」 안에 옮긴 말의 상대 날짜는 걸지 않고, 밖의 것은 건다", "시뮬: S2"]
- 이름: 표시
  문장: 주제 파일에 새로 들어가는 주장 줄(목록 항 · 번호 항 · 표 행)에는 이 저장소의 표시 가운데 하나가 붙어 있다.
  자리: [저장직전, 커밋직전]
  검사: 표시.검사_글 · 표시.검사_새줄 — 검사 전부터 있던 줄은 보지 않고 새 줄만 본다
  목적: [정보 추적성]
  시험: ["selftest: 주제 파일 새 줄의 상대 날짜와 표시 없음을 막는다", "selftest: 스테이지된 표시 없는 줄을 잡는다", "시뮬: S2", "시뮬: S13"]
- 이름: 제안확인
  문장: >-
    "[제안]"이 "[확인]"으로 바뀌는 것은 사용자가 GitHub 웹에서 한 커밋에서만 된다.
  자리: [커밋직전]
  검사: 표시.제안이확인으로 — 스테이지에서 같은 줄의 표시만 바뀐 것을 찾는다
  목적: [정보 추적성]
  시험: ["selftest: [제안]→[확인] 을 잡는다"]
- 이름: 생성파일
  문장: 스크립트가 만드는 파일(STATUS.md · README.md · worklog.md · memory/어긋남.md · CLAUDE.md 의 생성 블록)은 손으로 고치지 않는다. 원본을 고치고 `ops build` 를 돌린다.
  자리: [저장직전, 명령직전, 커밋직전]
  검사: 생성.생성파일인가 · 생성.다른것 — Edit · Write · 셸 재지정을 막고, 원본과 다른 채로는 커밋을 막는다. 어긋남 목록에도 오른다
  목적: [맥락 유지, 정보 추적성]
  시험: ["selftest: 생성 파일 Write 를 막는다", "selftest: CLAUDE.md 생성 블록 안의 Edit 를 막는다", "selftest: ops build 가 STATUS.md 와 README.md 를 만든다", "시뮬: S3"]
- 이름: 목차크기
  문장: CLAUDE.md 는 800줄, 한 절은 120줄을 넘지 않는다.
  자리: [저장직전, 커밋직전]
  검사: 기계.목차크기
  목적: [토큰 절약]
  시험: ["selftest: CLAUDE.md 가 800줄을 넘으면 잡는다", "시뮬: S6"]
- 이름: 지금절
  문장: 주제 파일의 「지금」 절은 열 줄 안이다. 지금 참인 것은 그 절에만 적는다.
  자리: [커밋직전]
  검사: 지금.검사
  목적: [맥락 유지, 토큰 절약]
  시험: ["selftest: 「지금」 절이 열 줄을 넘으면 잡는다", "selftest: 「지금」 첫 줄을 뽑는다"]
- 이름: 목차행
  문장: 주제 파일마다 `.ops.yml` 의 목차에 행(말 · 파일)이 하나 있다. 파일을 새로 만들면 같은 커밋에서 행을 더한다. 파일을 나누는 기준은 크기가 아니라 이것이다. 주제 파일은 ops/rules/ 에 두지 않는다.
  자리: [커밋직전]
  검사: 기계.목차행 — 주제 파일 가운데 목차에 없는 것, 목차가 가리키는데 없는 파일, ops/rules/ 에 생긴 규칙 파일 아닌 .md 를 찾는다
  목적: [토큰 절약, 맥락 유지]
  시험: ["selftest: 목차에 행이 없는 주제 파일을 커밋 직전에 잡는다", "selftest: ops/rules/ 에 생긴 주제 파일을 잡는다", "시뮬: S13", "읽힘: 훅-글.md 2026-09-17 규칙 8 목차행 글"]
- 이름: 작업로그
  문장: worklog.md 는 커밋하지 않는다. git log 에서 세션 시작마다 다시 만든다.
  자리: [커밋직전]
  검사: 기계.작업로그 — 스테이지에 worklog.md 가 있으면 막는다
  목적: [맥락 유지]
  시험: ["selftest: worklog.md 는 .gitignore 라 스테이지에 없다", "selftest: worklog.md 를 git log 에서 만든다"]
- 이름: 브랜치
  문장: 답이 끝날 때 고친 것이 커밋돼 있고 이 세션의 브랜치가 원격에 있다.
  자리: [답끝]
  검사: 기계.브랜치 — 커밋 안 한 변경이나 push 안 한 커밋이 있으면 답을 되돌린다 (한 세션에 두 번까지)
  목적: [맥락 유지, 정보 추적성]
  시험: ["selftest: 커밋 안 한 것이 있으면 답 끝에 되돌린다", "selftest: 원격에 없는 브랜치를 짚는다", "selftest: 두 번 되돌린 뒤에는 막지 않고 어긋남 개수만 알린다", "시뮬: S1"]
- 이름: 이력
  문장: 이력을 다시 쓰는 push(force · 브랜치 삭제)를 하지 않는다.
  자리: [명령직전, push직전]
  검사: 기계.셸검사 · ops/hooks/pre-push — 명령 글자와 push 의 ref 를 본다
  목적: [맥락 유지]
  시험: ["selftest: Bash 의 force push 를 막는다", "selftest: push 직전에 main 으로 직접 가는 push 를 막는다", "시뮬: S5"]
- 이름: 기계보호
  문장: 기계(ops/ · .claude/ · .ops.yml · memory/)를 통째로 지우지 않는다.
  자리: [명령직전]
  검사: 기계.셸검사 — rm -r 이 그 자리를 가리키면 막는다
  목적: [규칙 준수]
  시험: ["selftest: rm -r ops 를 막는다"]
- 이름: 낱말후보
  문장: 답의 낱말 가운데 사용자의 말 · 이 세션에 읽은 파일 · 허용 목록 어디에도 없는 낱말을 뽑아 판정 모델에 넘긴다.
  자리: [답끝]
  검사: 낱말.후보 — 잡는 것은 판정 모델이 규칙 「아는 말만 쓴다」로 한다
  목적: [좋은 설명]
  시험: ["selftest: 아는 낱말은 빼고 모르는 낱말을 후보로 뽑는다", "selftest: 사용자의 말과 읽은 파일의 낱말을 안다", "시뮬: S8"]
- 이름: 어긋남
  문장: 원본이 바뀌어 낡은 파생물은 막지 않고 memory/어긋남.md 에 오른다. 세션 시작에 통째로 들어가고 답 끝에 개수만 알린다.
  자리: [세션시작, 도구직후, 답끝]
  검사: 어긋남.만들기 — 파생물 옆 파일(<파생물>.meta.yml)에 적힌 출처의 해시와 지금 본문을 견준다
  목적: [정보 추적성]
  시험: ["selftest: 출처가 바뀌면 파생물이 오르고 바뀐 절 이름이 붙는다", "selftest: ops ack --그대로 가 항을 지우고 로그에 남긴다", "selftest: 세션 시작에 목록과 레포 상태가 들어간다", "selftest: 물음 직전에 어긋남 개수 한 줄이 들어간다", "시뮬: S4"]
- 이름: 규칙대장
  문장: 클로드가 읽는 규칙마다(기계 규칙 · 판단 규칙 · 훅 글) 어느 목적을 지키는지와 무엇으로 시험하는지가 적혀 있고, 시험은 실재한다. 규칙을 더하거나 고칠 때 목적 다섯이 훼손되지 않게 하는 검사다.
  자리: [커밋직전]
  검사: 기계.규칙대장 — 기계.yml 의 목적 · 시험 칸, 판단.md 끝의 「규칙마다 목적과 시험」 표, 훅-글.md 의 A 항 목적 · 판정 줄을 본다
  목적: [규칙 준수]
  시험: ["selftest: 기계 · 판단 · 훅 글에 목적과 시험이 다 있다", "selftest: 기계 규칙에 목적이 없으면 잡는다", "selftest: 시험 참조가 실재하지 않으면 잡는다", "selftest: 판단 규칙 표에 행이 없으면 잡는다", "selftest: 훅 글에 목적이 없으면 잡는다"]
- 이름: 자체시험합치기
  문장: 검사 · 훅 · 규칙 · 설정(ops/ · .claude/ · .github/ · .ops.yml)을 바꾼 push 는 워크플로가 자체 시험을 돌려 통과할 때만 main 에 합친다. 실패하면 PR 로 잡아 둔다.
  자리: [원격]
  검사: .github/workflows/sync-main.yml — 합친 결과로 python3 ops/test/selftest.py 를 돌린다
  목적: [규칙 준수, 맥락 유지]
  시험: ["워크플로: sync-main.yml", "읽힘: 설계.md 「지금」 2026-09-17 검사를 느슨하게 고친 push 가 PR 로 잡힌 기록"]
