# Single source of truth for artifact metadata.
# core.py reads this. Docs describing it are GENERATED from it — never hand-write them.
version: 1

# Dates, ids and log grouping use this zone, so a boundary matches the person
# reading it rather than whatever clock the container happens to run.
timezone: Asia/Seoul

# Every managed artifact carries these fields, in YAML front-matter (text files)
# or in a sidecar `<file>.meta.yml` (binary / unstructured files).
fields:
  id:           {required: true,  type: str,  desc: "Stable unique id. Never change it — links point here."}
  kind:         {required: true,  type: enum, desc: "What sort of artifact this is."}
  title:        {required: true,  type: str,  desc: "One line, human readable."}
  labels:       {required: false, type: list, desc: "Free-form tags. The primary way unstructured data stays findable."}
  summary:      {required: false, type: str,  desc: "<=200 chars. Shown in INDEX.md so nobody has to open the file."}
  derives_from: {required: false, type: list, desc: "Provenance edges: [{id, hash}]. hash = source body hash AT DERIVATION TIME."}
  generated_by: {required: false, type: str,  desc: "If set, the file is machine-produced. Editing it by hand is blocked."}
  status:       {required: false, type: enum, desc: "Lifecycle state."}
  created:      {required: false, type: date, desc: "YYYY-MM-DD"}
  updated:      {required: false, type: date, desc: "YYYY-MM-DD, bumped on content change."}

kinds:
  code:      {prefix: C, home: vault/code,        desc: "Source code and scripts that are the product, not the tooling."}
  doc:       {prefix: D, home: vault/docs,        desc: "Structured prose meant to be read as-is: specs, guides, reports."}
  knowledge: {prefix: K, home: vault/knowledge,   desc: "Distilled understanding. Usually derived from docs/records/raw."}
  record:    {prefix: R, home: vault/records,     desc: "Things that happened: meeting notes, runs, measurements."}
  raw:       {prefix: X, home: vault/inbox,       desc: "Unstructured drop-in. Labels are mandatory in practice; shape is not."}
  decision:  {prefix: A, home: memory/decisions,  desc: "An ADR. Why a choice was made, and what it binds."}

status_values: [active, draft, superseded, archived]

# Files that are produced by tooling. Hand-editing them is denied by HR-003.
# Paths are repo-relative; '*' globs one path segment, '**' any depth.
generated_paths:
  - INDEX.md
  - memory/digest/*.md
  - .meta/**

# Regions inside otherwise-handwritten files that are machine-owned.
generated_blocks:
  begin: "<!-- BEGIN GENERATED:"
  end:   "<!-- END GENERATED:"

# Writing ABOUT a rule is not breaking it. Content-scanning rules (HR-004)
# skip writes whose every target lives here.
content_scan_exempt:
  - ops/rules/**
  - ops/schema/**
  - ops/test/**

limits:
  state_md_bytes: 4096        # memory/STATE.md hard cap — HR-005
  summary_chars: 200
  session_card_bytes: 3072    # what SessionStart is allowed to inject
